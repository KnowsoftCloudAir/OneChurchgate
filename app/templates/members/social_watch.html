<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Social Stream — Churchgate</title>
  <style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;}
    #stage{position:fixed;left:0;right:0;top:0;bottom:72px;background:#000;}
    #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:1;}
    #swipeLayer{position:absolute;inset:0;z-index:5;touch-action:none;}
    #top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 4px;background:linear-gradient(#000e,#0000);}
    #top a,#top button{color:#fff;background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;}
    .tabs{position:fixed;top:40px;left:0;right:0;z-index:30;display:flex;gap:6px;overflow-x:auto;padding:0 10px 6px;}
    .tab{flex:0 0 auto;color:#e2e8f0;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:700;text-decoration:none;}
    .tab.on{background:#0d9488;}
    #nowTitle{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:30;max-width:90vw;
      padding:6px 14px;border-radius:999px;background:rgba(15,23,42,.82);border:1px solid rgba(255,255,255,.22);
      font-size:13px;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;font-size:11px;opacity:.7;pointer-events:none;text-align:center;}
  </style>
</head>
<body>
  <div id="top">
    <a href="/member" id="btnBack">Dashboard</a>
    <img src="/static/img/knowsoft-logo.png" alt="" style="height:24px" onerror="this.style.display='none'">
    <span>
      <button type="button" id="btnSound">Sound off</button>
      <button type="button" id="btnFs">Open full</button>
      <button type="button" id="btnReduce" style="display:none">Reduce screen</button>
    </span>
  </div>
  <div class="tabs">
    {% set cur = cat or 'all' %}
    <a class="tab {% if cur=='all' %}on{% endif %}" href="/member/social-watch?cat=all">All</a>
    <a class="tab {% if cur=='tv' %}on{% endif %}" href="/member/social-watch?cat=tv">TV</a>
    <a class="tab {% if cur=='movies' %}on{% endif %}" href="/member/social-watch?cat=movies">Movies</a>
    <a class="tab {% if cur=='news' %}on{% endif %}" href="/member/social-watch?cat=news">News</a>
    <a class="tab {% if cur=='games' %}on{% endif %}" href="/member/social-watch?cat=games">Games</a>
    <a class="tab {% if cur=='ministration' %}on{% endif %}" href="/member/social-watch?cat=ministration">Ministration</a>
    <a class="tab {% if cur=='others' %}on{% endif %}" href="/member/social-watch?cat=others">Others</a>
  </div>
  <div id="nowTitle">Stream</div>
  <div id="stage">
    {% if links %}
    <iframe id="stageFrame" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    {% else %}
    <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;padding:24px;text-align:center">No streams saved yet.</div>
    {% endif %}
    <div id="swipeLayer" aria-hidden="true"></div>
  </div>
  <div id="hint">Swipe or use arrow keys</div>
<script>
var ITEMS = [
{% for L in links %}
  {url: {{ (L.embed_url or '')|tojson }}, title: {{ (L.title or 'Stream')|tojson }}}{% if not loop.last %},{% endif %}
{% endfor %}
].filter(function(x){ return x && x.url && String(x.url).indexOf('undefined')<0 && x.url !== '#'; });
var idx = 0, soundOn = false, startY = null, startX = null;

function hdUrl(url){
  if(!url) return '';
  try {
    var u=new URL(url, location.origin);
    u.searchParams.set('autoplay','1');
    u.searchParams.set('mute', soundOn?'0':'1');
    u.searchParams.set('playsinline','1');
    u.searchParams.set('rel','0');
    if(u.hostname.indexOf('youtube')>=0){
      u.searchParams.set('vq','hd1080');
      u.searchParams.set('hd','1');
      u.searchParams.set('modestbranding','1');
    }
    return u.toString();
  } catch(e){ return url; }
}
function play(i){
  if(!ITEMS.length) return;
  idx = (i + ITEMS.length) % ITEMS.length;
  var fr = document.getElementById('stageFrame');
  var item = ITEMS[idx];
  var titleEl = document.getElementById('nowTitle');
  if(titleEl) titleEl.textContent = item.title || 'Stream';
  if(fr && item.url){
    fr.src = hdUrl(item.url);
    try {
      localStorage.setItem('cg_last_embed', item.url);
      localStorage.setItem('cg_last_stream', location.pathname + location.search);
      localStorage.setItem('cg_stream_closed','0');
    } catch(e){}
  }
}
function next(){ play(idx+1); }
function prev(){ play(idx-1); }
function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function syncFsBtns(){
  var fs = isFs();
  var a = document.getElementById('btnFs');
  var b = document.getElementById('btnReduce');
  if(a) a.style.display = fs ? 'none' : 'inline-block';
  if(b) b.style.display = fs ? 'inline-block' : 'none';
  var stage = document.getElementById('stage');
  if(stage) stage.style.bottom = fs ? '0' : '72px';
}
function enterFs(){
  var el = document.getElementById('stage');
  var req = el && (el.requestFullscreen || el.webkitRequestFullscreen);
  if(req) req.call(el);
}
function exitFs(){
  var ex = document.exitFullscreen || document.webkitExitFullscreen;
  if(ex) ex.call(document);
}
document.getElementById('btnSound').onclick = function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? 'Sound on' : 'Sound off';
  play(idx);
};
document.getElementById('btnFs').onclick = enterFs;
document.getElementById('btnReduce').onclick = exitFs;
document.addEventListener('fullscreenchange', syncFsBtns);
document.addEventListener('webkitfullscreenchange', syncFsBtns);

function bindSwipe(el){
  if(!el) return;
  el.addEventListener('touchstart', function(e){
    startY = e.changedTouches[0].clientY; startX = e.changedTouches[0].clientX;
  }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(startY==null) return;
    var dy = e.changedTouches[0].clientY - startY;
    var dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) { dy<0 ? next() : prev(); }
    else if(Math.abs(dx) > 40) { dx<0 ? next() : prev(); }
    startY = startX = null;
  }, {passive:true});
  el.addEventListener('mousedown', function(e){ startY = e.clientY; startX = e.clientX; });
  window.addEventListener('mouseup', function(e){
    if(startY==null) return;
    var dy = e.clientY - startY, dx = e.clientX - startX;
    if(Math.abs(dy) > 50 && Math.abs(dy) > Math.abs(dx)) { dy<0 ? next() : prev(); }
    else if(Math.abs(dx) > 50) { dx<0 ? next() : prev(); }
    startY = startX = null;
  });
}
bindSwipe(document.getElementById('swipeLayer'));
window.addEventListener('keydown', function(e){
  if(['ArrowDown','PageDown','ArrowRight'].indexOf(e.key)>=0){ e.preventDefault(); next(); }
  if(['ArrowUp','PageUp','ArrowLeft'].indexOf(e.key)>=0){ e.preventDefault(); prev(); }
  if(e.key==='Escape') exitFs();
  if(e.key==='f' || e.key==='F'){ isFs()?exitFs():enterFs(); }
});
var last=null; try{ last=localStorage.getItem('cg_last_embed'); }catch(e){}
var start=0;
if(last){ for(var i=0;i<ITEMS.length;i++){ if(ITEMS[i].url===last){ start=i; break; } } }
play(start);
syncFsBtns();
</script>
</body></html>
