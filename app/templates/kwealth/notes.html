<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes — Kwealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hl { background: #fde68a; border-radius: 2px; cursor: pointer; }
    canvas { touch-action: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-100" x-data="notesPad()" x-init="init()">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <a href="/member/kwealth" class="text-sm text-teal-700 font-semibold">← Kwealth</a>
    <h1 class="text-2xl font-bold mt-2">Notes</h1>
    <p class="text-sm text-slate-500 mb-4">Type or write with a pen/stylus. Words known to Angel glow — double-tap them to hear Angel.</p>

    <form method="post" action="/member/kwealth/notes" enctype="multipart/form-data" class="bg-white rounded-2xl border p-5 space-y-3 shadow-sm"
          @submit="beforeSubmit">
      <input name="title" placeholder="Note title" class="w-full rounded-xl border px-3 py-2">
      <div>
        <label class="text-xs font-medium text-slate-600">Typing</label>
        <div id="typed" contenteditable="true"
             class="w-full min-h-[8rem] rounded-xl border px-3 py-2 mt-1 bg-white"
             @input="onType()" @dblclick="onDbl($event)"></div>
        <input type="hidden" name="body_text" x-ref="bodyField">
      </div>
      <div>
        <label class="text-xs font-medium text-slate-600">Pen / handwriting</label>
        <canvas x-ref="pad" width="640" height="280" class="w-full mt-1 rounded-xl border bg-stone-50"></canvas>
        <div class="flex gap-2 mt-2">
          <button type="button" @click="clearPad()" class="text-xs px-3 py-1 rounded-lg bg-slate-200">Clear ink</button>
        </div>
        <input type="file" name="ink" x-ref="inkFile" class="hidden" accept="image/png">
      </div>
      <button class="w-full py-3 rounded-xl bg-violet-700 text-white font-semibold">Save note</button>
    </form>

    <div class="mt-6 space-y-3">
      {% for n in notes %}
      <div class="bg-white rounded-xl border p-4">
        <div class="font-semibold">{{ n.title }}</div>
        {% if n.body_text %}<p class="text-sm mt-1 whitespace-pre-wrap">{{ n.body_text }}</p>{% endif %}
        {% if n.ink_path %}<img src="{{ n.ink_path }}" class="mt-2 max-w-full rounded-lg border" alt="ink">{% endif %}
      </div>
      {% endfor %}
    </div>
  </div>
  <script>
    window.__HL__ = {{ highlight_words|tojson }};
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
  function notesPad() {
    return {
      words: window.__HL__ || [],
      drawing: false,
      init() {
        const c = this.$refs.pad;
        const ctx = c.getContext('2d');
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        const pos = (e) => {
          const r = c.getBoundingClientRect();
          const x = (('touches' in e) ? e.touches[0].clientX : e.clientX) - r.left;
          const y = (('touches' in e) ? e.touches[0].clientY : e.clientY) - r.top;
          return { x: x * (c.width/r.width), y: y * (c.height/r.height) };
        };
        const start = (e) => { this.drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); };
        const move = (e) => { if (!this.drawing) return; const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); };
        const end = () => { this.drawing = false; };
        c.addEventListener('mousedown', start); c.addEventListener('mousemove', move);
        window.addEventListener('mouseup', end);
        c.addEventListener('touchstart', start, {passive:false});
        c.addEventListener('touchmove', move, {passive:false});
        c.addEventListener('touchend', end);
      },
      clearPad() {
        const c = this.$refs.pad; c.getContext('2d').clearRect(0,0,c.width,c.height);
      },
      onType() {
        const el = document.getElementById('typed');
        let text = el.innerText || '';
        // highlight known words
        const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        let html = text.replace(/&/g,'&amp;').replace(/</g,'&lt;');
        this.words.forEach(w => {
          if (!w || w.length < 4) return;
          const re = new RegExp('\\b(' + esc(w) + ')\\b', 'gi');
          html = html.replace(re, '<span class="hl" data-w="$1">$1</span>');
        });
        // only update if not identical to avoid cursor jump often — simple approach:
        if (el.dataset.last !== text) {
          const sel = window.getSelection();
          el.innerHTML = html.replace(/\n/g, '<br>');
          el.dataset.last = text;
        }
      },
      onDbl(ev) {
        const t = (ev.target.innerText || '').trim();
        if (!t || t.length < 3) return;
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(
          'About ' + t + '. Open Matthew Henry commentary and your excerpts for more. Search Bible Study Tools for this word.'
        );
        speechSynthesis.speak(u);
        fetch('/member/api/angel-ask', {
          method:'POST', credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ question: 'Explain ' + t + ' from the Bible' })
        }).then(r=>r.json()).then(j => {
          if (j && j.answer) {
            speechSynthesis.cancel();
            speechSynthesis.speak(new SpeechSynthesisUtterance(j.answer));
          }
        }).catch(()=>{});
      },
      beforeSubmit() {
        const el = document.getElementById('typed');
        this.$refs.bodyField.value = (el.innerText || '').trim();
        // attach canvas as file
        const c = this.$refs.pad;
        c.toBlob((blob) => {
          if (!blob) return;
          const dt = new DataTransfer();
          dt.items.add(new File([blob], 'ink.png', { type: 'image/png' }));
          this.$refs.inkFile.files = dt.files;
        });
      }
    }
  }
  </script>
</body>
</html>
