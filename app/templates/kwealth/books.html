<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books — Kwealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .book-stage { perspective: 1400px; }
    .book-page {
      transform-style: preserve-3d; transition: transform .45s ease;
      min-height: 22rem; background: linear-gradient(180deg,#fffdf7,#f5ecd7);
      color: #1c1917; border-radius: 0 12px 12px 0;
      box-shadow: 8px 12px 30px rgba(0,0,0,.35);
    }
    .book-page.flip { transform: rotateY(-12deg); }
  </style>
</head>
<body class="min-h-screen bg-slate-900 text-slate-100" x-data="bookReader()" x-init="init()">
  <div class="max-w-3xl mx-auto px-4 py-6">
    <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
      <a href="/member/kwealth" class="text-sm text-teal-300">← Kwealth</a>
      <form method="post" action="/member/kwealth/load-books"><button class="text-xs px-3 py-1.5 rounded-lg bg-slate-700">Load books</button></form>
    </div>
    <h1 class="text-2xl font-bold mb-3">Books</h1>
    <label class="text-xs text-slate-400">Synchronized titles</label>
    <select class="w-full mt-1 mb-4 rounded-xl px-3 py-3 text-slate-900" x-model="bookId" @change="goBook()">
      {% for b in books %}
      <option value="{{ b.id }}" {% if book and b.id==book.id %}selected{% endif %}>{{ b.title }} ({{ b.page_count }} pages)</option>
      {% endfor %}
    </select>
    {% if not books %}<p class="text-sm text-amber-300 mb-4">No books yet. Click Load books.</p>{% endif %}

    {% if book %}
    <div class="book-stage mb-4">
      <div class="book-page p-6 sm:p-8" :class="{ 'flip': flipping }" id="pageSurface"
           @mouseup="onSelect()" @touchend="onSelect()">
        <p class="text-xs text-stone-500 mb-3" x-text="'Page ' + (pageIndex+1) + ' of ' + pages.length"></p>
        <div class="text-base sm:text-lg leading-relaxed whitespace-pre-wrap font-serif" x-text="pages[pageIndex] || ''"></div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 mb-4">
      <button @click="prev()" class="px-4 py-2 rounded-xl bg-slate-700 font-semibold">← Prev</button>
      <button @click="next()" class="px-4 py-2 rounded-xl bg-slate-700 font-semibold">Next →</button>
      <button @click="readAloud()" class="px-4 py-2 rounded-xl bg-amber-600 font-semibold">🔊 Angel read aloud</button>
      <button @click="stopRead()" class="px-4 py-2 rounded-xl bg-slate-600 text-sm">Stop</button>
      <button @click="saveSelection()" class="px-4 py-2 rounded-xl bg-emerald-700 font-semibold">Save highlight → Excerpts</button>
    </div>
    <p class="text-xs text-slate-400">Select text on the page, then “Save highlight”. Closing the book keeps your last page.</p>
    <script>
      window.__BOOK__ = {
        id: {{ book.id }},
        pages: {{ pages|tojson }},
        pageIndex: {{ page_index }}
      };
    </script>
    {% endif %}
  </div>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
  function bookReader() {
    return {
      bookId: '{{ book.id if book else "" }}',
      pages: [],
      pageIndex: 0,
      flipping: false,
      init() {
        const B = window.__BOOK__;
        if (B) { this.pages = B.pages || []; this.pageIndex = B.pageIndex || 0; this.bookId = String(B.id); }
      },
      goBook() { location.href = '/member/kwealth/books?book_id=' + this.bookId; },
      async saveProgress() {
        if (!this.bookId) return;
        try {
          const fd = new FormData();
          fd.append('book_id', this.bookId);
          fd.append('page_index', this.pageIndex);
          await fetch('/member/kwealth/books/progress', { method:'POST', body: fd, credentials:'same-origin' });
        } catch(e) {}
      },
      prev() {
        if (this.pageIndex <= 0) return;
        this.flipping = true;
        setTimeout(() => { this.pageIndex--; this.flipping = false; this.saveProgress(); }, 200);
      },
      next() {
        if (this.pageIndex >= this.pages.length - 1) return;
        this.flipping = true;
        setTimeout(() => { this.pageIndex++; this.flipping = false; this.saveProgress(); }, 200);
      },
      readAloud() {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(this.pages[this.pageIndex] || '');
        u.rate = 0.95;
        speechSynthesis.speak(u);
      },
      stopRead() { try { speechSynthesis.cancel(); } catch(e) {} },
      onSelect() {},
      async saveSelection() {
        const sel = (window.getSelection && window.getSelection().toString() || '').trim();
        if (!sel) { alert('Select text on the page first'); return; }
        const fd = new FormData();
        fd.append('book_id', this.bookId);
        fd.append('text', sel);
        fd.append('title', 'Highlight');
        await fetch('/member/kwealth/excerpts/from-book', { method:'POST', body: fd, credentials:'same-origin' });
        alert('Saved to Excerpts for Angel');
      }
    }
  }
  window.addEventListener('beforeunload', () => {
    try {
      const el = document.querySelector('[x-data]');
      // progress already saved on page change
    } catch(e) {}
  });
  </script>
</body>
</html>
