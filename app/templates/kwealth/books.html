<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books — Kwealth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: radial-gradient(ellipse at top, #1e293b, #0f172a 60%); min-height: 100vh; }
    .page-sheet {
      background: linear-gradient(180deg, #fffef8 0%, #f3e9d3 100%);
      color: #1c1917;
      border-radius: 4px 16px 16px 4px;
      box-shadow: 12px 16px 40px rgba(0,0,0,.45), inset -8px 0 20px rgba(120,80,20,.08);
      min-height: 70vh;
      transition: transform .35s ease;
    }
    .page-sheet.flip { transform: perspective(1200px) rotateY(-8deg); }
  </style>
</head>
<body class="text-slate-100" x-data="bookReader()" x-init="init()">
  <header class="sticky top-0 z-20 bg-slate-950/90 backdrop-blur border-b border-white/10">
    <div class="max-w-4xl mx-auto px-3 py-2.5 flex flex-wrap items-center gap-2">
      <a href="/member/kwealth" class="text-xs text-teal-300">← Kwealth</a>
      <span class="font-bold text-sm sm:text-base">Books</span>
      <!-- Device file picker (like personal music) -->
      <input type="file" x-ref="filePick" class="hidden" accept=".pdf,.txt,application/pdf,text/plain" multiple
             @change="uploadFiles($event)">
      <button type="button" @click="$refs.filePick.click()"
              class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-700 hover:bg-slate-600"
              :disabled="uploading" x-text="uploading ? 'Scanning…' : 'Load'"></button>
      <button type="button" @click="toggleAngelRead()" class="px-3 py-1.5 rounded-lg text-xs font-bold"
              :class="reading ? 'bg-rose-600' : 'bg-amber-600'" x-text="reading ? 'Stop' : 'Angel'"></button>
      <button type="button" @click="saveSelection()" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-emerald-700">Save highlighted → Excerpts</button>
      <select class="ml-auto text-slate-900 text-xs rounded-lg px-2 py-1.5 max-w-[50%]" x-model="bookId" @change="goBook()">
        {% for b in books %}
        <option value="{{ b.id }}" {% if book and b.id==book.id %}selected{% endif %}>{{ b.title }}</option>
        {% endfor %}
      </select>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    {% if request.query_params.get('uploaded') %}
    <p class="text-center text-sm text-emerald-300 mb-3">Added {{ request.query_params.get('uploaded') }} book(s) from your device.</p>
    {% endif %}
    {% if book %}
    <p class="text-center text-xs text-slate-400 mb-3" x-text="'Page ' + (pageIndex+1) + ' / ' + pages.length"></p>
    <div class="page-sheet p-6 sm:p-10 font-serif text-base sm:text-lg leading-relaxed whitespace-pre-wrap"
         :class="{flip: flipping}" id="pageSurface">
      <span x-text="pages[pageIndex]||''"></span>
    </div>
    <div class="flex justify-center gap-4 mt-6">
      <button @click="prev()" class="w-28 py-3 rounded-2xl bg-white/10 font-semibold hover:bg-white/20">← Prev</button>
      <button @click="next()" class="w-28 py-3 rounded-2xl bg-white/10 font-semibold hover:bg-white/20">Next →</button>
    </div>
    <script>
      window.__BOOK__ = { id: {{ book.id }}, pages: {{ pages|tojson }}, pageIndex: {{ page_index }} };
    </script>
    {% else %}
    <p class="text-center text-slate-400 py-20">Tap <strong>Load</strong> to open your device and choose PDF or text books.</p>
    {% endif %}
  </main>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
  function bookReader() {
    return {
      bookId: '', pages: [], pageIndex: 0, flipping: false, reading: false, uploading: false,
      init() {
        const B = window.__BOOK__;
        if (B) { this.pages = B.pages||[]; this.pageIndex = B.pageIndex||0; this.bookId = String(B.id); }
      },
      goBook() { location.href = '/member/kwealth/books?book_id=' + this.bookId; },
      async uploadFiles(ev) {
        const files = Array.from(ev.target.files || []);
        if (!files.length) return;
        this.uploading = true;
        try {
          const fd = new FormData();
          files.forEach(f => fd.append('files', f));
          const r = await fetch('/member/kwealth/books/upload', {
            method: 'POST', body: fd, credentials: 'same-origin'
          });
          if (r.redirected) location.href = r.url;
          else location.href = '/member/kwealth/books';
        } catch (e) {
          alert('Could not load books from device');
          this.uploading = false;
        }
        ev.target.value = '';
      },
      async saveProgress() {
        if (!this.bookId) return;
        const fd = new FormData(); fd.append('book_id', this.bookId); fd.append('page_index', this.pageIndex);
        try { await fetch('/member/kwealth/books/progress', { method:'POST', body: fd, credentials:'same-origin' }); } catch(e) {}
      },
      prev() { if (this.pageIndex<=0) return; this.flipping=true; setTimeout(()=>{ this.pageIndex--; this.flipping=false; this.saveProgress(); if(this.reading) this.speakPage(); }, 180); },
      next() { if (this.pageIndex>=this.pages.length-1){ this.reading=false; return;} this.flipping=true; setTimeout(()=>{ this.pageIndex++; this.flipping=false; this.saveProgress(); if(this.reading) this.speakPage(); }, 180); },
      speakPage() {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(this.pages[this.pageIndex]||'');
        u.rate = 0.95;
        u.onend = () => { if (this.reading) this.next(); };
        speechSynthesis.speak(u);
      },
      toggleAngelRead() {
        this.reading = !this.reading;
        if (this.reading) this.speakPage(); else try { speechSynthesis.cancel(); } catch(e) {}
      },
      async saveSelection() {
        const sel = (window.getSelection && window.getSelection().toString() || '').trim();
        if (!sel) { alert('Highlight text on the page first'); return; }
        const fd = new FormData(); fd.append('book_id', this.bookId); fd.append('text', sel); fd.append('title', 'Highlight');
        await fetch('/member/kwealth/excerpts/from-book', { method:'POST', body: fd, credentials:'same-origin' });
        alert('Saved to Excerpts');
      }
    }
  }
  </script>
</body>
</html>
