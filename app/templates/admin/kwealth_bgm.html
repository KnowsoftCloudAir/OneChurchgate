<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Background Music — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-6">
    <a href="/admin" class="text-sm text-blue-700 font-semibold">← Admin</a>
    <h1 class="text-2xl font-black mt-2">Background music (Books)</h1>
    <p class="text-sm text-slate-600 mt-1">Upload calm tracks for members to use while reading in Kwealth Books. Files stay until you delete them.</p>
    {% if request.query_params.get('ok') %}
    <p class="mt-3 text-emerald-700 font-semibold">Upload saved.</p>
    {% endif %}
    <form method="post" action="/admin/kwealth/bgm/upload" enctype="multipart/form-data" class="mt-4 bg-white rounded-2xl border p-4 space-y-3">
      <label class="block text-sm font-semibold">Select audio files (mp3, m4a, wav, ogg)</label>
      <input type="file" name="files" multiple required accept="audio/*,.mp3,.m4a,.ogg,.wav,.aac" class="w-full text-sm">
      <button class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold">Upload music</button>
    </form>
    <div class="mt-6 space-y-2">
      {% for it in items %}
      <div class="bg-white border rounded-xl p-3 flex justify-between gap-2 items-center">
        <div>
          <p class="font-semibold text-sm">{{ it.title }}</p>
          <a class="text-xs text-blue-600" href="{{ it.url }}" target="_blank">Preview</a>
        </div>
        <form method="post" action="/admin/kwealth/bgm/delete" onsubmit="return confirm('Delete this track?')">
          <input type="hidden" name="track_id" value="{{ it.id }}">
          <button class="text-xs text-red-600 font-semibold">Delete</button>
        </form>
      </div>
      {% else %}
      <p class="text-slate-400 text-sm">No tracks yet.</p>
      {% endfor %}
    </div>
  </div>
</body>
</html>
