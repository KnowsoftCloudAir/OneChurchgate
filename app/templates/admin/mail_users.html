{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto p-6 text-slate-100">
  <h1 class="text-2xl font-bold mb-2">Email a member</h1>
  <p class="text-sm text-slate-400 mb-6">Sends from the Churchgate mailbox on knowsoft.org.uk</p>
  {% if sent == True %}<p class="text-teal-300 mb-4">Sent.</p>{% endif %}
  {% if sent == False %}<p class="text-rose-300 mb-4">Send failed. Check MAIL_HOST settings.</p>{% endif %}
  <form method="post" class="space-y-3 bg-slate-900 border border-slate-700 rounded-2xl p-5">
    <label class="text-xs">To</label>
    <input name="to_email" list="members" required class="w-full rounded-lg px-3 py-2 text-slate-900">
    <datalist id="members">
      {% for m in members %}
      <option value="{{ m.email }}">{{ m.full_name }}</option>
      {% endfor %}
    </datalist>
    <input name="subject" required placeholder="Subject" class="w-full rounded-lg px-3 py-2 text-slate-900">
    <textarea name="body" rows="8" required class="w-full rounded-lg px-3 py-2 text-slate-900"></textarea>
    <button class="px-4 py-2 rounded-xl bg-teal-600 font-semibold">Send</button>
  </form>
</div>
{% endblock %}
