<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password — Churchgate</title>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
<form method="post" class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-6 space-y-4">
  <h1 class="text-xl font-bold">Reset password</h1>
  {% if sent %}<p class="text-teal-300 text-sm">If that email exists, a reset code was sent.</p>{% endif %}
  {% if error %}<p class="text-rose-300 text-sm">{{ error }}</p>{% endif %}
  <input name="email" type="email" required placeholder="you@email.com" class="w-full rounded-lg px-3 py-2 text-slate-900">
  <button class="w-full py-2.5 rounded-xl bg-teal-600 font-semibold">Send code</button>
  <a class="block text-center text-sm text-slate-400" href="/auth/reset">I already have a code</a>
</form></body></html>
