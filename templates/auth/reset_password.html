<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password - Knowsoft Churchgate</title>
<style>body{font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f8fafc,#eef6f5);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px;color:#0f172a}.card{background:#fff;max-width:500px;width:100%;padding:34px;border-radius:22px;box-shadow:0 18px 55px rgba(15,23,42,.12);border:1px solid #e2e8f0}.brand{text-align:center;margin-bottom:22px}.mark{width:64px;height:64px;margin:auto auto 14px;border-radius:18px;background:#0d9488;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}h1{margin:0}.sub{color:#64748b;font-size:14px;line-height:1.5}.msg{padding:13px 15px;border-radius:12px;margin:18px 0;font-size:14px}.err{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}.ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#047857}label{display:block;font-weight:700;font-size:14px;margin:14px 0 7px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:12px;background:#0d9488;color:#fff;font-weight:800;font-size:16px;margin-top:14px;cursor:pointer}.hint{font-size:12px;color:#64748b;margin-top:6px}.foot{text-align:center;margin-top:20px;font-size:13px}.foot a{color:#0f766e;font-weight:700}</style></head>
<body><main class="card"><div class="brand"><div class="mark">C</div><h1>Reset Your Password</h1><p class="sub">Enter your email to receive a verification code, then choose a new password for your Churchgate account.</p></div>
{% if error %}<div class="msg err">{{ error }}</div>{% endif %}{% if success %}<div class="msg ok">{{ success }}</div>{% endif %}
{% if not success %}<form method="post" action="/auth/send-reset-code"><label>Email Address</label><input name="email" type="email" value="{{ email or '' }}" required><button type="submit">Send Verification Code</button></form><hr style="border:0;border-top:1px solid #e2e8f0;margin:24px 0">
<form method="post" action="/auth/reset"><label>Email Address</label><input name="email" type="email" value="{{ email or '' }}" required><label>Verification Code</label><input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required><div class="hint">The code expires in 5 minutes.</div><label>New Password</label><input name="password" type="password" autocomplete="new-password" required><label>Repeat New Password</label><input name="password2" type="password" autocomplete="new-password" required><button type="submit">Change Password</button></form>{% endif %}
<div class="foot"><a href="/auth/login">Return to Sign In</a></div></main></body></html>
