<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Church Hymns — Churchgate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .hymn-body {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 1.15rem;
      line-height: 1.85;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 text-slate-100" x-data="hymnBook()" x-init="load()">
  <header class="sticky top-0 z-20 bg-slate-950/95 backdrop-blur border-b border-white/10">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <a href="/member/portal" class="text-sm text-teal-300 font-semibold">← Dashboard</a>
      <a href="/member/kwealth" class="text-sm text-slate-400">Kwealth</a>
      <h1 class="font-bold text-lg ml-1">Church Hymns</h1>
      <span class="text-xs text-slate-400 ml-auto" x-text="filtered.length + ' of ' + (hymns.length||0) + ' hymns'"></span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6">
    <p class="text-sm text-slate-400 mb-3">One combined list: public-domain hymns plus any packs loaded for your global church. Search by any word in the title.</p>

    <!-- Search -->
    <div class="mb-4">
      <label class="text-xs uppercase tracking-wide text-slate-400">Search hymn title</label>
      <div class="mt-1 flex gap-2">
        <input type="search" x-model="q" @input="onSearch()"
               placeholder="e.g. grace, blood, assurance, jesus…"
               class="flex-1 rounded-xl px-3 py-3 text-slate-900 font-medium"
               autocomplete="off">
        <button type="button" @click="q=''; onSearch()"
                class="rounded-xl px-3 py-2 bg-slate-700 text-sm font-semibold"
                x-show="q">Clear</button>
      </div>
      <p class="text-xs text-slate-500 mt-1" x-show="q && filtered.length === 0">No hymn title matches “<span x-text="q"></span>”.</p>
      <p class="text-xs text-emerald-400/90 mt-1" x-show="q && filtered.length > 0" x-text="'Found ' + filtered.length + ' hymn(s)'"></p>
    </div>

    <!-- One combined list -->
    <div class="space-y-2 mb-6 max-h-[50vh] overflow-y-auto rounded-2xl border border-white/10 bg-black/20 p-2"
         x-show="!current">
      <template x-for="h in filtered" :key="h.number + '-' + h.title">
        <button type="button" @click="openHymn(h)"
                class="w-full text-left rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-2.5 transition">
          <div class="flex items-baseline justify-between gap-2">
            <span class="text-amber-300 font-mono text-xs" x-text="'No. ' + h.number"></span>
            <span class="text-[10px] text-slate-500 uppercase" x-text="h.source || ''"></span>
          </div>
          <span class="block font-semibold text-sm sm:text-base mt-0.5" x-text="h.title"></span>
        </button>
      </template>
      <p class="text-center text-slate-500 text-sm py-6" x-show="!hymns.length">Loading hymns…</p>
    </div>

    <!-- Full hymn view -->
    <template x-if="current">
      <article class="rounded-3xl bg-[#fffef8] text-slate-900 shadow-2xl overflow-hidden">
        <div class="bg-indigo-900 text-white px-5 py-4 flex justify-between items-start gap-3">
          <div>
            <p class="text-amber-200 text-xs font-mono" x-text="'Hymn No. ' + current.number"></p>
            <h2 class="text-xl sm:text-2xl font-bold tracking-tight" x-text="current.title"></h2>
            <p class="text-xs text-indigo-200 mt-1" x-show="current.source" x-text="current.source"></p>
          </div>
          <button type="button" @click="current=null" class="text-sm px-3 py-1 rounded-lg bg-white/15 shrink-0">Close</button>
        </div>
        <div class="hymn-body px-5 sm:px-8 py-6 max-h-[70vh] overflow-y-auto" x-text="displayBody"></div>
      </article>
    </template>
  </main>
  <script>
  function hymnBook() {
    return {
      hymns: [],
      q: '',
      filtered: [],
      current: null,
      get displayBody() {
        if (!this.current) return '';
        let b = this.current.body || '';
        b = b.replace(/^Author:[^\n]*\n+/i, '');
        return b.trim();
      },
      async load() {
        try {
          const r = await fetch('/member/api/hymns', { credentials: 'same-origin' });
          const j = await r.json();
          this.hymns = j.hymns || [];
          this.filtered = this.hymns.slice();
        } catch (e) {
          this.hymns = [];
          this.filtered = [];
        }
      },
      onSearch() {
        const raw = (this.q || '').trim().toLowerCase();
        if (!raw) {
          this.filtered = this.hymns.slice();
          return;
        }
        // Any word in the query may match the title (AND across words)
        const words = raw.split(/\s+/).filter(Boolean);
        this.filtered = this.hymns.filter(h => {
          const title = (h.title || '').toLowerCase();
          return words.every(w => title.includes(w));
        });
      },
      openHymn(h) {
        this.current = h;
      }
    }
  }
  </script>
</body>
</html>
